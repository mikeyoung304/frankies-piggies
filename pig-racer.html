<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏎️ Pig Racer!</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a472a;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    height: 100vh;
    cursor: default;
    user-select: none;
  }

  /* Start Screen */
  #start-screen {
    position: fixed; inset: 0;
    background: linear-gradient(135deg, #1a472a, #0d2818);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 100;
  }
  #start-screen h1 {
    font-size: clamp(40px, 10vw, 80px);
    color: #fff;
    text-shadow: 0 4px 20px rgba(0,0,0,0.5);
    margin-bottom: 10px;
  }
  #start-screen .subtitle {
    font-size: 18px; color: #aad4aa;
    margin-bottom: 40px; letter-spacing: 2px;
  }
  .start-btn {
    background: linear-gradient(135deg, #ff6b9d, #ff9f43);
    color: white; border: none;
    padding: 18px 50px; border-radius: 50px;
    font-size: 24px; font-weight: 900;
    cursor: pointer; letter-spacing: 2px;
    box-shadow: 0 8px 30px rgba(255,107,157,0.4);
    transition: transform 0.2s;
  }
  .start-btn:hover { transform: scale(1.08); }
  .controls-hint {
    margin-top: 30px; color: #7ab87a;
    font-size: 14px; text-align: center;
    line-height: 2;
  }
  .controls-hint kbd {
    background: #2a5a3a; padding: 4px 10px;
    border-radius: 6px; border: 1px solid #3a7a4a;
    font-family: monospace; font-size: 13px;
  }

  /* Game Canvas Area */
  #game-area {
    position: fixed; inset: 0;
    display: none;
  }
  canvas {
    display: block;
    width: 100%; height: 100%;
  }

  /* HUD */
  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: none;
    justify-content: space-between;
    padding: 12px 20px;
    z-index: 10;
    pointer-events: none;
  }
  .hud-box {
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(8px);
    padding: 8px 16px;
    border-radius: 12px;
    color: white;
    font-weight: 800;
    font-size: 16px;
  }
  .hud-box span { color: #ffd32a; }

  /* Race Position Indicator */
  #position-display {
    position: fixed; top: 60px; right: 20px;
    z-index: 10; display: none;
    background: rgba(0,0,0,0.7);
    border-radius: 14px; padding: 10px 16px;
    color: white; font-weight: 800;
    text-align: center; min-width: 70px;
  }
  #position-display .pos-num {
    font-size: 36px; color: #ffd32a;
    line-height: 1;
  }
  #position-display .pos-label {
    font-size: 11px; color: #aaa;
    letter-spacing: 1px; text-transform: uppercase;
  }

  /* Countdown */
  #countdown {
    position: fixed; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    z-index: 50;
    font-size: 120px;
    font-weight: 900;
    color: white;
    text-shadow: 0 0 60px rgba(255,255,255,0.5);
    pointer-events: none;
  }

  /* Finish Screen */
  #finish-screen {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85);
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 100;
  }
  #finish-screen h1 {
    font-size: clamp(30px, 8vw, 60px);
    margin-bottom: 10px;
  }
  #finish-screen .result-text {
    font-size: 24px; color: #ccc;
    margin-bottom: 30px;
  }
  #finish-screen .trophy { font-size: 80px; margin-bottom: 20px; }
  .finish-stats {
    display: flex; gap: 30px; margin-bottom: 30px;
  }
  .stat-box {
    text-align: center; background: rgba(255,255,255,0.08);
    padding: 16px 24px; border-radius: 14px;
  }
  .stat-box .stat-val {
    font-size: 28px; font-weight: 900; color: #ffd32a;
  }
  .stat-box .stat-lbl {
    font-size: 11px; color: #888;
    letter-spacing: 1px; text-transform: uppercase;
    margin-top: 4px;
  }

  /* Back button */
  #back-btn {
    position: fixed; top: 12px; left: 12px;
    z-index: 200;
    background: rgba(0,0,0,0.5);
    color: white; border: none;
    width: 40px; height: 40px;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center; justify-content: center;
    transition: background 0.2s;
  }
  #back-btn:hover { background: rgba(255,107,157,0.5); }

  /* Mobile touch controls */
  #touch-controls {
    position: fixed; bottom: 20px;
    left: 50%; transform: translateX(-50%);
    display: none; gap: 16px;
    z-index: 20;
  }
  .touch-btn {
    width: 70px; height: 70px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.3);
    color: white; font-size: 28px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .touch-btn:active {
    background: rgba(255,107,157,0.4);
    border-color: #ff6b9d;
  }

  @media (pointer: coarse) {
    #touch-controls { display: flex !important; }
  }
</style>
</head>
<body>

<button id="back-btn" onclick="location.href='index.html'">←</button>

<!-- START SCREEN -->
<div id="start-screen">
  <h1>🏎️ Pig Racer!</h1>
  <div class="subtitle">Race your piggy to the finish!</div>
  <button class="start-btn" id="start-btn">🏁 START RACE</button>
  <div class="controls-hint">
    <kbd>←</kbd> <kbd>→</kbd> to steer &nbsp;|&nbsp; <kbd>↑</kbd> to boost<br>
    Dodge obstacles! Collect ⭐ for points!
  </div>
</div>

<!-- COUNTDOWN -->
<div id="countdown"></div>

<!-- HUD -->
<div id="hud">
  <div class="hud-box">⭐ <span id="score-display">0</span></div>
  <div class="hud-box">🏁 <span id="progress-display">0</span>%</div>
  <div class="hud-box">💨 <span id="speed-display">0</span> mph</div>
</div>

<!-- POSITION -->
<div id="position-display">
  <div class="pos-num" id="pos-num">1</div>
  <div class="pos-label">position</div>
</div>

<!-- GAME AREA -->
<div id="game-area">
  <canvas id="canvas"></canvas>
</div>

<!-- TOUCH CONTROLS -->
<div id="touch-controls">
  <button class="touch-btn" id="touch-left">⬅️</button>
  <button class="touch-btn" id="touch-boost">🔥</button>
  <button class="touch-btn" id="touch-right">➡️</button>
</div>

<!-- FINISH SCREEN -->
<div id="finish-screen">
  <div class="trophy" id="finish-trophy">🏆</div>
  <h1 id="finish-title" style="color:#ffd32a">You Win!</h1>
  <div class="result-text" id="finish-subtitle">Amazing race!</div>
  <div class="finish-stats">
    <div class="stat-box"><div class="stat-val" id="final-pos">1st</div><div class="stat-lbl">Position</div></div>
    <div class="stat-box"><div class="stat-val" id="final-score">0</div><div class="stat-lbl">Stars</div></div>
    <div class="stat-box"><div class="stat-val" id="final-time">0s</div><div class="stat-lbl">Time</div></div>
  </div>
  <button class="start-btn" onclick="resetGame()">🔄 RACE AGAIN</button>
  <div style="margin-top:16px">
    <button class="start-btn" style="background:linear-gradient(135deg,#6b5ce7,#a855f7);padding:12px 30px;font-size:16px" onclick="location.href='index.html'">🐷 PIGGY WORLD</button>
  </div>
</div>

<script>
// ===== GAME CONFIG =====
const RACE_LENGTH = 5000;     // shorter race!
const LANE_COUNT = 3;         // 3 lanes
const PLAYER_SPEED = 5;       // base forward speed (faster!)
const BOOST_SPEED = 8;        // boost speed
const BOOST_MAX = 100;        // boost fuel
const BOOST_DRAIN = 0.8;      // drain per frame (slower drain!)
const BOOST_REGEN = 0.6;      // regen per frame (faster recharge!)
const AI_COUNT = 3;           // number of AI racers
const OBSTACLE_FREQ = 0.004;  // very few obstacles!
const STAR_FREQ = 0.03;       // more stars!
const ROAD_SCROLL = 3;        // road line scroll speed multiplier

// ===== ELEMENTS =====
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const startScreen = document.getElementById('start-screen');
const countdownEl = document.getElementById('countdown');
const hud = document.getElementById('hud');
const posDisplay = document.getElementById('position-display');
const gameArea = document.getElementById('game-area');
const finishScreen = document.getElementById('finish-screen');
const backBtn = document.getElementById('back-btn');

// ===== GAME STATE =====
let gameRunning = false;
let gameTime = 0;
let score = 0;
let player = null;
let aiRacers = [];
let obstacles = [];
let stars = [];
let particles = [];
let roadOffset = 0;
let boost = BOOST_MAX;
let boosting = false;
let keys = {};
let raceStartTime = 0;
let playerFinished = false;

// Road geometry
let roadLeft, roadRight, laneWidth, roadCenterX;

// ===== RESIZE =====
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  roadLeft = canvas.width * 0.25;
  roadRight = canvas.width * 0.75;
  laneWidth = (roadRight - roadLeft) / LANE_COUNT;
  roadCenterX = (roadLeft + roadRight) / 2;
}
window.addEventListener('resize', resize);
resize();

// ===== PLAYER & AI =====
function laneX(lane) {
  return roadLeft + laneWidth * lane + laneWidth / 2;
}

function createPlayer() {
  return {
    x: laneX(1),
    targetX: laneX(1),
    y: canvas.height * 0.72,
    lane: 1,
    distance: 0,
    speed: 0,
    emoji: '🐷',
    size: 44,
    wobble: 0,
    isPlayer: true
  };
}

function createAI(index) {
  const lane = index % LANE_COUNT;
  const pigEmojis = ['🐖', '🐽', '🐗'];
  return {
    x: laneX(lane),
    targetX: laneX(lane),
    y: canvas.height * 0.72,
    lane: lane,
    distance: 0,
    speed: PLAYER_SPEED * (0.55 + Math.random() * 0.25),
    baseSpeed: PLAYER_SPEED * (0.55 + Math.random() * 0.25),
    emoji: pigEmojis[index % pigEmojis.length],
    size: 38,
    wobble: 0,
    isPlayer: false,
    laneTimer: 0,
    renderY: 0,    // visual Y position (relative to player)
    finished: false
  };
}

// ===== OBSTACLES & STARS =====
function spawnObstacle() {
  const lane = Math.floor(Math.random() * LANE_COUNT);
  const types = [
    { emoji: '🪨', size: 32 },
    { emoji: '🌲', size: 36 },
    { emoji: '💩', size: 30 },
    { emoji: '🚧', size: 34 },
    { emoji: '🐔', size: 30 },
  ];
  const t = types[Math.floor(Math.random() * types.length)];
  obstacles.push({
    x: laneX(lane),
    distance: player.distance + canvas.height * 1.2 + Math.random() * 300,
    lane: lane,
    emoji: t.emoji,
    size: t.size,
    hit: false
  });
}

function spawnStar() {
  const lane = Math.floor(Math.random() * LANE_COUNT);
  stars.push({
    x: laneX(lane),
    distance: player.distance + canvas.height * 1.2 + Math.random() * 300,
    lane: lane,
    emoji: '⭐',
    size: 28,
    collected: false,
    glow: 0
  });
}

// ===== PARTICLES =====
function addParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 0.5) * 6 - 2,
      life: 1,
      color: color,
      size: 3 + Math.random() * 4
    });
  }
}

// ===== INPUT =====
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

// Touch controls
const touchLeft = document.getElementById('touch-left');
const touchRight = document.getElementById('touch-right');
const touchBoost = document.getElementById('touch-boost');

touchLeft.addEventListener('touchstart', e => { e.preventDefault(); keys['ArrowLeft'] = true; });
touchLeft.addEventListener('touchend', e => { keys['ArrowLeft'] = false; });
touchRight.addEventListener('touchstart', e => { e.preventDefault(); keys['ArrowRight'] = true; });
touchRight.addEventListener('touchend', e => { keys['ArrowRight'] = false; });
touchBoost.addEventListener('touchstart', e => { e.preventDefault(); keys['ArrowUp'] = true; });
touchBoost.addEventListener('touchend', e => { keys['ArrowUp'] = false; });

// ===== COUNTDOWN =====
function doCountdown(cb) {
  let count = 3;
  countdownEl.style.display = 'flex';
  countdownEl.textContent = count;
  const iv = setInterval(() => {
    count--;
    if (count > 0) {
      countdownEl.textContent = count;
    } else if (count === 0) {
      countdownEl.textContent = 'GO!';
      countdownEl.style.color = '#4aff4a';
    } else {
      clearInterval(iv);
      countdownEl.style.display = 'none';
      countdownEl.style.color = 'white';
      cb();
    }
  }, 800);
}

// ===== START GAME =====
function startGame() {
  startScreen.style.display = 'none';
  gameArea.style.display = 'block';
  hud.style.display = 'flex';
  posDisplay.style.display = 'block';
  resize();

  player = createPlayer();
  aiRacers = [];
  for (let i = 0; i < AI_COUNT; i++) aiRacers.push(createAI(i));
  obstacles = [];
  stars = [];
  particles = [];
  score = 0;
  boost = BOOST_MAX;
  gameTime = 0;
  playerFinished = false;

  doCountdown(() => {
    gameRunning = true;
    raceStartTime = Date.now();
    gameLoop();
  });
}

document.getElementById('start-btn').addEventListener('click', startGame);

// ===== GAME LOOP =====
function gameLoop() {
  if (!gameRunning) return;
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

// ===== UPDATE =====
function update() {
  gameTime++;

  // Player steering
  if (keys['ArrowLeft'] || keys['a']) {
    if (player.lane > 0 && Math.abs(player.x - player.targetX) < 10) {
      player.lane--;
      player.targetX = laneX(player.lane);
    }
    keys['ArrowLeft'] = false;
    keys['a'] = false;
  }
  if (keys['ArrowRight'] || keys['d']) {
    if (player.lane < LANE_COUNT - 1 && Math.abs(player.x - player.targetX) < 10) {
      player.lane++;
      player.targetX = laneX(player.lane);
    }
    keys['ArrowRight'] = false;
    keys['d'] = false;
  }

  // Boost
  boosting = (keys['ArrowUp'] || keys['w'] || keys[' ']) && boost > 0;
  if (boosting) {
    boost = Math.max(0, boost - BOOST_DRAIN);
    player.speed = BOOST_SPEED;
  } else {
    boost = Math.min(BOOST_MAX, boost + BOOST_REGEN);
    player.speed = PLAYER_SPEED;
  }

  // Smooth lane movement
  player.x += (player.targetX - player.x) * 0.18;
  player.distance += player.speed;
  player.wobble += 0.15;

  // Scroll road
  roadOffset += player.speed * ROAD_SCROLL;

  // AI update
  aiRacers.forEach(ai => {
    // Speed variation
    ai.laneTimer--;
    if (ai.laneTimer <= 0) {
      ai.speed = ai.baseSpeed * (0.85 + Math.random() * 0.3);
      // Occasionally change lane
      if (Math.random() < 0.3) {
        const dir = Math.random() < 0.5 ? -1 : 1;
        ai.lane = Math.max(0, Math.min(LANE_COUNT - 1, ai.lane + dir));
        ai.targetX = laneX(ai.lane);
      }
      ai.laneTimer = 60 + Math.random() * 120;
    }
    ai.x += (ai.targetX - ai.x) * 0.1;
    if (!ai.finished) ai.distance += ai.speed;
    ai.wobble += 0.12;

    // Check if AI finished
    if (ai.distance >= RACE_LENGTH && !ai.finished) {
      ai.finished = true;
    }
  });

  // Spawn obstacles & stars
  if (Math.random() < OBSTACLE_FREQ) spawnObstacle();
  if (Math.random() < STAR_FREQ) spawnStar();

  // Check obstacle collisions with player
  obstacles.forEach(obs => {
    if (obs.hit) return;
    const dist = Math.abs(obs.distance - player.distance);
    if (dist < 40 && obs.lane === player.lane) {
      obs.hit = true;
      player.speed = 0;
      player.distance -= 5;
      addParticles(player.x, player.y, '#ff4444', 12);
      // Tiny bump - you barely slow down!
    }
  });

  // Check star collection
  stars.forEach(star => {
    if (star.collected) return;
    const dist = Math.abs(star.distance - player.distance);
    if (dist < 40 && star.lane === player.lane) {
      star.collected = true;
      score += 10;
      addParticles(star.x, worldToScreenY(star.distance), '#ffd32a', 10);
    }
  });

  // Cleanup off-screen items
  obstacles = obstacles.filter(o => o.distance > player.distance - 200);
  stars = stars.filter(s => s.distance > player.distance - 200 && !s.collected);

  // Particles
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.15;
    p.life -= 0.025;
    p.size *= 0.97;
  });
  particles = particles.filter(p => p.life > 0);

  // Calculate position
  const allDistances = [player.distance, ...aiRacers.map(a => a.distance)];
  allDistances.sort((a, b) => b - a);
  const position = allDistances.indexOf(player.distance) + 1;
  document.getElementById('pos-num').textContent = position;

  // Update HUD
  document.getElementById('score-display').textContent = score;
  document.getElementById('progress-display').textContent = Math.min(100, Math.floor(player.distance / RACE_LENGTH * 100));
  document.getElementById('speed-display').textContent = Math.floor(player.speed * 25);

  // Check finish
  if (player.distance >= RACE_LENGTH && !playerFinished) {
    playerFinished = true;
    setTimeout(() => finishRace(position), 500);
  }
}

function worldToScreenY(worldDist) {
  return player.y - (worldDist - player.distance) * 0.8;
}

// ===== DRAW =====
function draw() {
  const W = canvas.width;
  const H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  // Sky / Grass
  ctx.fillStyle = '#1a472a';
  ctx.fillRect(0, 0, W, H);

  // Draw grass stripes
  const grassColors = ['#1a5a2a', '#1a472a'];
  const stripeH = 60;
  const grassOff = roadOffset % (stripeH * 2);
  for (let y = -stripeH * 2; y < H + stripeH; y += stripeH) {
    ctx.fillStyle = grassColors[Math.abs(Math.floor((y + grassOff) / stripeH)) % 2];
    ctx.fillRect(0, y + grassOff % stripeH, W, stripeH);
  }

  // Road
  ctx.fillStyle = '#333';
  ctx.fillRect(roadLeft - 10, 0, roadRight - roadLeft + 20, H);

  // Road edges
  ctx.fillStyle = '#ff4444';
  ctx.fillRect(roadLeft - 10, 0, 10, H);
  ctx.fillStyle = '#fff';
  ctx.fillRect(roadRight, 0, 10, H);

  // Lane dashes
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 2;
  ctx.setLineDash([30, 30]);
  const dashOff = roadOffset % 60;
  ctx.lineDashOffset = -dashOff;
  for (let i = 1; i < LANE_COUNT; i++) {
    const lx = roadLeft + laneWidth * i;
    ctx.beginPath();
    ctx.moveTo(lx, 0);
    ctx.lineTo(lx, H);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // Draw finish line if close
  const finishScreenY = worldToScreenY(RACE_LENGTH);
  if (finishScreenY > -100 && finishScreenY < H + 100) {
    const sqSize = 20;
    for (let i = 0; i < Math.ceil((roadRight - roadLeft) / sqSize); i++) {
      for (let row = 0; row < 2; row++) {
        ctx.fillStyle = (i + row) % 2 === 0 ? '#fff' : '#111';
        ctx.fillRect(roadLeft + i * sqSize, finishScreenY + row * sqSize - sqSize, sqSize, sqSize);
      }
    }
  }

  // Draw obstacles
  obstacles.forEach(obs => {
    if (obs.hit) return;
    const sy = worldToScreenY(obs.distance);
    if (sy < -50 || sy > H + 50) return;
    ctx.font = obs.size + 'px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(obs.emoji, obs.x, sy);
  });

  // Draw stars
  stars.forEach(star => {
    if (star.collected) return;
    const sy = worldToScreenY(star.distance);
    if (sy < -50 || sy > H + 50) return;
    star.glow += 0.08;
    const scale = 1 + Math.sin(star.glow) * 0.15;
    ctx.font = (star.size * scale) + 'px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(star.emoji, star.x, sy);
  });

  // Draw AI racers
  aiRacers.forEach(ai => {
    const sy = worldToScreenY(ai.distance);
    if (sy < -100 || sy > H + 100) return;
    const bob = Math.sin(ai.wobble) * 3;
    ctx.font = ai.size + 'px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(ai.emoji, ai.x, sy + bob);
  });

  // Draw player
  const playerBob = Math.sin(player.wobble) * 4;
  ctx.font = player.size + 'px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(player.emoji, player.x, player.y + playerBob);

  // Boost flame
  if (boosting) {
    ctx.font = '24px serif';
    ctx.fillText('🔥', player.x, player.y + 30 + playerBob);
    addParticles(player.x, player.y + 35, '#ff9f43', 1);
  }

  // Boost bar
  const barW = 100, barH = 8;
  const barX = player.x - barW / 2;
  const barY = player.y + 45;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath();
  ctx.roundRect(barX, barY, barW, barH, 4);
  ctx.fill();
  const boostPct = boost / BOOST_MAX;
  const boostColor = boostPct > 0.3 ? '#4aff4a' : '#ff4444';
  ctx.fillStyle = boostColor;
  ctx.beginPath();
  ctx.roundRect(barX, barY, barW * boostPct, barH, 4);
  ctx.fill();

  // Particles
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Mini progress bar at bottom
  const progBarW = W * 0.6;
  const progBarH = 6;
  const progBarX = (W - progBarW) / 2;
  const progBarY = H - 20;
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath();
  ctx.roundRect(progBarX, progBarY, progBarW, progBarH, 3);
  ctx.fill();
  // All racers on the progress bar
  const allRacers = [player, ...aiRacers];
  allRacers.forEach(r => {
    const pct = Math.min(1, r.distance / RACE_LENGTH);
    const dotX = progBarX + progBarW * pct;
    ctx.font = r.isPlayer ? '16px serif' : '12px serif';
    ctx.textAlign = 'center';
    ctx.fillText(r.emoji, dotX, progBarY - 4);
  });
}

// ===== FINISH =====
function finishRace(position) {
  gameRunning = false;
  const elapsed = ((Date.now() - raceStartTime) / 1000).toFixed(1);

  finishScreen.style.display = 'flex';
  hud.style.display = 'none';
  posDisplay.style.display = 'none';

  const trophies = ['🏆', '🥈', '🥉', '🐷'];
  const titles = ['YOU WIN!', '2nd Place!', '3rd Place!', 'Nice Try!'];
  const subs = ['Amazing racer!', 'So close!', 'Not bad!', 'Keep practicing!'];
  const colors = ['#ffd32a', '#c0c0c0', '#cd7f32', '#ff6b9d'];
  const posStrs = ['1st', '2nd', '3rd', '4th'];

  const idx = Math.min(position - 1, 3);
  document.getElementById('finish-trophy').textContent = trophies[idx];
  document.getElementById('finish-title').textContent = titles[idx];
  document.getElementById('finish-title').style.color = colors[idx];
  document.getElementById('finish-subtitle').textContent = subs[idx];
  document.getElementById('final-pos').textContent = posStrs[idx];
  document.getElementById('final-score').textContent = score;
  document.getElementById('final-time').textContent = elapsed + 's';
}

// ===== RESET =====
function resetGame() {
  finishScreen.style.display = 'none';
  startScreen.style.display = 'flex';
  gameArea.style.display = 'none';
}
