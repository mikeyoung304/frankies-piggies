<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🃏 Oink Memory</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(135deg, #4a0a20, #6a1535, #4a0a20);
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, sans-serif;
    user-select: none;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  /* Piggy snout pattern overlay */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      radial-gradient(ellipse 30px 23px at 50% 50%, rgba(255,180,210,0.2) 60%, transparent 61%),
      radial-gradient(circle 6px at 36% 40%, rgba(200,60,100,0.2) 100%),
      radial-gradient(circle 6px at 64% 40%, rgba(200,60,100,0.2) 100%);
    background-size: 80px 80px;
    pointer-events: none;
    z-index: 0;
  }

  /* ========= HUD ========= */
  #hud {
    position: relative; z-index: 1;
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 20px;
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(8px);
    flex-shrink: 0;
  }
  .hud-box {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    padding: 8px 18px;
    color: white;
    text-align: center;
    min-width: 80px;
  }
  .hud-label { font-size: 10px; opacity: 0.6; letter-spacing: 2px; text-transform: uppercase; }
  .hud-value { font-size: 22px; font-weight: 900; line-height: 1.2; }
  #home-btn {
    background: rgba(255,255,255,0.1);
    border: 2px solid rgba(255,255,255,0.2);
    border-radius: 14px;
    padding: 8px 18px;
    color: white;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.2s;
  }
  #home-btn:hover { background: rgba(255,255,255,0.2); }

  /* ========= TITLE ========= */
  .game-title {
    position: relative; z-index: 1;
    font-size: 28px;
    font-weight: 900;
    background: linear-gradient(135deg, #ff6b9d, #ffd32a, #00d2d3);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin: 16px 0 8px;
    text-align: center;
  }

  /* ========= GRID ========= */
  #card-grid {
    position: relative; z-index: 1;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    padding: 10px 16px 20px;
    width: 100%;
    max-width: 500px;
    flex: 1;
  }

  /* ========= CARD ========= */
  .card {
    aspect-ratio: 1;
    perspective: 600px;
    cursor: pointer;
  }
  .card-inner {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.4s ease;
    border-radius: 14px;
  }
  .card.flipped .card-inner   { transform: rotateY(180deg); }
  .card.matched .card-inner   { transform: rotateY(180deg); }
  .card-front, .card-back {
    position: absolute;
    inset: 0;
    border-radius: 14px;
    backface-visibility: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(28px, 8vw, 48px);
  }
  /* Back = face-down (what you see first) */
  .card-back {
    background: linear-gradient(135deg, #5a1a30, #3a1a40);
    border: 2px solid #aa3a6a;
    font-size: clamp(24px, 6vw, 36px);
    color: rgba(255,255,255,0.3);
  }
  .card-back::after {
    content: '🐽';
    font-size: clamp(28px, 8vw, 42px);
    filter: grayscale(1) opacity(0.3);
  }
  /* Front = face-up (the matching emoji) */
  .card-front {
    background: linear-gradient(135deg, #3a1a2a, #2a1535);
    border: 2px solid #aa4a6a;
    transform: rotateY(180deg);
  }
  .card.matched .card-front {
    background: linear-gradient(135deg, #0a3a0a, #1a4a1a);
    border-color: #4aff4a;
    box-shadow: 0 0 20px rgba(74,255,74,0.3);
    animation: match-pulse 0.5s ease-out;
  }
  @keyframes match-pulse {
    0%   { transform: rotateY(180deg) scale(1.15); }
    100% { transform: rotateY(180deg) scale(1); }
  }
  .card.wrong .card-inner {
    animation: wrong-shake 0.3s ease-out;
  }
  @keyframes wrong-shake {
    0%, 100% { transform: rotateY(180deg) translateX(0); }
    25%       { transform: rotateY(180deg) translateX(-6px); }
    75%       { transform: rotateY(180deg) translateX(6px); }
  }

  /* ========= OVERLAY SCREENS ========= */
  .overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 200; text-align: center; padding: 24px;
  }
  #start-screen { background: linear-gradient(135deg, #4a0a20, #6a1535); }
  #win-screen   { background: rgba(60,0,20,0.92); backdrop-filter: blur(14px); display: none; }

  .screen-emoji { font-size: 72px; margin-bottom: 16px; }
  .screen-title {
    font-size: 40px; font-weight: 900;
    background: linear-gradient(135deg, #ff6b9d, #ffd32a);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; margin-bottom: 8px;
  }
  .screen-sub { font-size: 15px; color: #aaa; margin-bottom: 28px; line-height: 1.6; }
  .screen-btn {
    background: linear-gradient(135deg, #ff6b9d, #ff9f43);
    border: none; border-radius: 50px; padding: 14px 36px;
    color: white; font-size: 18px; font-weight: 900;
    cursor: pointer; letter-spacing: 1px;
    box-shadow: 0 6px 20px rgba(255,107,157,0.4);
    transition: transform 0.15s; margin: 6px;
  }
  .screen-btn:hover { transform: scale(1.06); }
  .screen-btn.secondary {
    background: rgba(255,255,255,0.1);
    border: 2px solid rgba(255,255,255,0.2);
    box-shadow: none; font-size: 15px;
  }
  .win-stat {
    font-size: 18px; color: #ffd32a; font-weight: 700;
    margin: 4px 0;
  }
  .win-rank {
    font-size: 32px; font-weight: 900; color: white;
    margin: 16px 0 8px;
    text-shadow: 0 4px 20px rgba(255,255,255,0.3);
  }

  /* Fireworks */
  .firework {
    position: fixed;
    pointer-events: none;
    font-size: 40px;
    animation: firework-burst 1s ease-out forwards;
    z-index: 300;
  }
  @keyframes firework-burst {
    0%   { opacity: 1; transform: scale(0.3); }
    60%  { opacity: 1; transform: scale(1.4); }
    100% { opacity: 0; transform: scale(1.1); }
  }
</style>
</head>
<body>

<!-- ========= HUD ========= -->
<div id="hud">
  <div class="hud-box">
    <div class="hud-label">Moves</div>
    <div class="hud-value" id="moves-display">0</div>
  </div>
  <a href="index.html" id="home-btn">🏠 Home</a>
  <div class="hud-box">
    <div class="hud-label">Time</div>
    <div class="hud-value" id="timer-display">0:00</div>
  </div>
</div>

<div class="game-title">🃏 Oink Memory 🐷</div>

<!-- ========= CARD GRID ========= -->
<div id="card-grid"></div>

<!-- ========= START SCREEN ========= -->
<div class="overlay" id="start-screen">
  <div class="screen-emoji">🃏</div>
  <div class="screen-title">Oink Memory!</div>
  <div class="screen-sub">Flip cards to find matching pig pairs!<br>Remember where they are!<br>Match all 8 pairs to win! 🐷</div>
  <button class="screen-btn" id="start-btn">▶ START!</button>
  <a href="index.html"><button class="screen-btn secondary">🏠 Hub</button></a>
</div>

<!-- ========= WIN SCREEN ========= -->
<div class="overlay" id="win-screen">
  <div class="screen-emoji">🎉</div>
  <div class="screen-title">You Win!!</div>
  <div class="win-rank" id="win-rank">Amazing!</div>
  <div class="win-stat" id="win-moves"></div>
  <div class="win-stat" id="win-time"></div>
  <br>
  <button class="screen-btn" id="restart-btn">▶ Play Again</button>
  <a href="index.html"><button class="screen-btn secondary">🏠 Hub</button></a>
</div>

<script>
const PAIRS = ['🐷','🐖','🐗','🐽','🥓','🥚','🧅','🌽'];

let cards = [];
let flipped = [];
let matched = 0;
let moves = 0;
let timerEl = document.getElementById('timer-display');
let movesEl = document.getElementById('moves-display');
let timerInterval = null;
let secondsElapsed = 0;
let canFlip = false;

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function formatTime(s) {
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function buildGrid() {
  const grid = document.getElementById('card-grid');
  grid.innerHTML = '';
  cards = [];
  flipped = [];
  matched = 0;
  moves = 0;
  secondsElapsed = 0;
  movesEl.textContent = '0';
  timerEl.textContent = '0:00';

  const deck = shuffle([...PAIRS, ...PAIRS]);

  deck.forEach((emoji, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.emoji = emoji;
    card.dataset.index = i;
    card.innerHTML = `
      <div class="card-inner">
        <div class="card-front">${emoji}</div>
        <div class="card-back"></div>
      </div>`;
    card.addEventListener('click', () => onCardClick(card));
    grid.appendChild(card);
    cards.push(card);
  });
}

function onCardClick(card) {
  if (!canFlip) return;
  if (card.classList.contains('flipped') || card.classList.contains('matched')) return;
  if (flipped.length >= 2) return;

  card.classList.add('flipped');
  flipped.push(card);

  if (flipped.length === 2) {
    canFlip = false;
    moves++;
    movesEl.textContent = moves;
    checkMatch();
  }
}

function checkMatch() {
  const [a, b] = flipped;
  if (a.dataset.emoji === b.dataset.emoji) {
    // Match!
    setTimeout(() => {
      a.classList.add('matched');
      b.classList.add('matched');
      a.classList.remove('flipped');
      b.classList.remove('flipped');
      flipped = [];
      matched++;
      canFlip = true;
      if (matched === PAIRS.length) {
        triggerWin();
      }
    }, 400);
  } else {
    // No match
    a.classList.add('wrong');
    b.classList.add('wrong');
    setTimeout(() => {
      a.classList.remove('flipped', 'wrong');
      b.classList.remove('flipped', 'wrong');
      flipped = [];
      canFlip = true;
    }, 900);
  }
}

function startGame() {
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('win-screen').style.display = 'none';
  buildGrid();

  // Brief preview: show all cards face-up for 1.5s
  canFlip = false;
  cards.forEach(c => c.classList.add('flipped'));
  setTimeout(() => {
    cards.forEach(c => c.classList.remove('flipped'));
    canFlip = true;
    startTimer();
  }, 1500);
}

function startTimer() {
  if (timerInterval) clearInterval(timerInterval);
  secondsElapsed = 0;
  timerInterval = setInterval(() => {
    secondsElapsed++;
    timerEl.textContent = formatTime(secondsElapsed);
  }, 1000);
}

function triggerWin() {
  clearInterval(timerInterval);

  let rank = 'Nice work! 👏';
  if (moves <= 10)      rank = 'MEMORY MASTER! 🧠🏆';
  else if (moves <= 14) rank = 'Super smart! 🌟';
  else if (moves <= 20) rank = 'Great memory! 🎉';

  document.getElementById('win-rank').textContent = rank;
  document.getElementById('win-moves').textContent = `🐾 ${moves} moves`;
  document.getElementById('win-time').textContent  = `⏱️ ${formatTime(secondsElapsed)}`;
  document.getElementById('win-screen').style.display = 'flex';

  // Fireworks!
  for (let i = 0; i < 8; i++) {
    setTimeout(() => {
      const f = document.createElement('div');
      f.className = 'firework';
      f.textContent = ['🎆','🎇','✨','🎉','⭐','🌟'][Math.floor(Math.random() * 6)];
      f.style.left = (10 + Math.random() * 80) + 'vw';
      f.style.top  = (5 + Math.random() * 60) + 'vh';
      document.body.appendChild(f);
      setTimeout(() => f.remove(), 1100);
    }, i * 150);
  }
}

document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);
</script>
</body>
</html>
